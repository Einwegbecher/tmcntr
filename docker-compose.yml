version: '3.8'

services:
  backend:
    build: ./backend/app
    container_name: time_tracker_backend
    volumes:
      - ./backend/app:/app
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - time_tracker_network

  nginx:
    image: nginx:alpine
    container_name: time_tracker_nginx
    ports:
      - "6000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - time_tracker_network

networks:
  time_tracker_network:
    driver: bridge

volumes:
  db_data:
